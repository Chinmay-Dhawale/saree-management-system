name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable

      - name: Install dependencies
        working-directory: saree_app
        run: flutter pub get

      - name: Build APK
        working-directory: saree_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saree-management-apk
          path: saree_app/build/app/outputs/flutter-apk/app-release.apk
